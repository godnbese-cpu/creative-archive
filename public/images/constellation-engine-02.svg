<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <radialGradient id="bg2" cx="65%" cy="60%" r="110%">
      <stop offset="0%" stop-color="#0f1210"/>
      <stop offset="100%" stop-color="#07080a"/>
    </radialGradient>
    <radialGradient id="aglow">
      <stop offset="0%" stop-color="#86ef6e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#86ef6e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bglow">
      <stop offset="0%" stop-color="#5b84ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5b84ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg2)"/>

  <!-- repulsion lens field: stars bending around an invisible cursor -->
  <g fill="#ece9e2">
    <circle cx="300" cy="300" r="1.4" opacity="0.55"/><circle cx="360" cy="360" r="1.2" opacity="0.5"/>
    <circle cx="430" cy="410" r="1" opacity="0.4"/><circle cx="510" cy="450" r="0.9" opacity="0.35"/>
    <circle cx="590" cy="470" r="0.8" opacity="0.3"/><circle cx="670" cy="480" r="0.8" opacity="0.3"/>
    <circle cx="750" cy="470" r="0.9" opacity="0.35"/><circle cx="830" cy="450" r="1" opacity="0.4"/>
    <circle cx="910" cy="415" r="1.1" opacity="0.45"/><circle cx="980" cy="370" r="1.2" opacity="0.5"/>
    <circle cx="1040" cy="310" r="1.4" opacity="0.55"/>
    <circle cx="670" cy="180" r="1" opacity="0.4"/><circle cx="680" cy="280" r="0.9" opacity="0.35"/>
    <circle cx="690" cy="680" r="0.9" opacity="0.35"/><circle cx="670" cy="780" r="1" opacity="0.4"/>
    <circle cx="480" cy="600" r="0.9" opacity="0.35"/><circle cx="880" cy="600" r="1" opacity="0.4"/>
    <circle cx="200" cy="200" r="1" opacity="0.4"/><circle cx="1150" cy="250" r="1" opacity="0.4"/>
    <circle cx="240" cy="700" r="1.1" opacity="0.45"/><circle cx="1120" cy="740" r="1" opacity="0.4"/>
    <circle cx="1400" cy="480" r="1.2" opacity="0.5"/><circle cx="120" cy="480" r="1.2" opacity="0.5"/>
    <circle cx="1450" cy="180" r="0.8" opacity="0.3"/><circle cx="150" cy="850" r="0.8" opacity="0.3"/>
  </g>

  <!-- the lens focus -->
  <circle cx="670" cy="480" r="180" fill="url(#aglow)" opacity="0.5"/>
  <circle cx="670" cy="480" r="260" fill="none" stroke="rgba(134,239,110,0.14)" stroke-width="1"/>
  <circle cx="670" cy="480" r="120" fill="none" stroke="rgba(236,233,226,0.10)" stroke-width="1" stroke-dasharray="4 8"/>
  <circle cx="670" cy="480" r="3" fill="#86ef6e" opacity="0.9"/>

  <!-- a shooting idea crossing the field -->
  <g stroke="rgba(91,132,255,0.55)" stroke-width="1.4" fill="none">
    <line x1="1180" y1="700" x2="1330" y2="580"/>
  </g>
  <circle cx="1340" cy="572" r="26" fill="url(#bglow)"/>
  <circle cx="1338" cy="574" r="2.6" fill="#b7c4ff"/>
</svg>
