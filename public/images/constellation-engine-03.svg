<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="34%" r="105%">
      <stop offset="0%" stop-color="#12101d"/>
      <stop offset="100%" stop-color="#07070a"/>
    </radialGradient>
    <radialGradient id="vg">
      <stop offset="0%" stop-color="#8f7bff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8f7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vg2">
      <stop offset="0%" stop-color="#5b84ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5b84ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg3)"/>

  <!-- layered depth: far, mid, near worlds -->
  <circle cx="380" cy="420" r="220" fill="url(#vg2)" opacity="0.5"/>
  <circle cx="820" cy="700" r="300" fill="url(#vg)" opacity="0.6"/>
  <circle cx="480" cy="1180" r="260" fill="url(#vg2)" opacity="0.45"/>

  <!-- far stars (small, dim) -->
  <g fill="#ece9e2">
    <circle cx="100" cy="120" r="0.8" opacity="0.3"/><circle cx="300" cy="80" r="0.7" opacity="0.28"/>
    <circle cx="620" cy="140" r="0.9" opacity="0.32"/><circle cx="900" cy="100" r="0.7" opacity="0.26"/>
    <circle cx="1100" cy="240" r="0.8" opacity="0.3"/><circle cx="80" cy="520" r="0.7" opacity="0.28"/>
    <circle cx="1120" cy="520" r="0.8" opacity="0.3"/><circle cx="160" cy="1000" r="0.8" opacity="0.3"/>
    <circle cx="1060" cy="1060" r="0.7" opacity="0.28"/><circle cx="400" cy="1460" r="0.8" opacity="0.3"/>
    <circle cx="760" cy="1500" r="0.7" opacity="0.26"/><circle cx="980" cy="1380" r="0.9" opacity="0.32"/>
  </g>

  <!-- mid stars -->
  <g fill="#ece9e2">
    <circle cx="240" cy="300" r="1.4" opacity="0.5"/><circle cx="520" cy="260" r="1.2" opacity="0.45"/>
    <circle cx="760" cy="340" r="1.5" opacity="0.52"/><circle cx="980" cy="420" r="1.2" opacity="0.44"/>
    <circle cx="140" cy="700" r="1.3" opacity="0.48"/><circle cx="640" cy="560" r="1.1" opacity="0.42"/>
    <circle cx="300" cy="900" r="1.2" opacity="0.44"/><circle cx="900" cy="880" r="1.3" opacity="0.48"/>
    <circle cx="200" cy="1240" r="1.2" opacity="0.44"/><circle cx="680" cy="1320" r="1.4" opacity="0.5"/>
  </g>
  <g fill="#8f7bff">
    <circle cx="820" cy="700" r="3.4" opacity="0.9"/><circle cx="480" cy="1180" r="2.8" opacity="0.85"/>
    <circle cx="380" cy="420" r="2.6" opacity="0.8"/>
  </g>
  <g fill="#86ef6e">
    <circle cx="1090" cy="1180" r="1.6" opacity="0.6"/><circle cx="120" cy="180" r="1.4" opacity="0.55"/>
  </g>

  <!-- constellation weave through the three depths -->
  <g stroke="rgba(160,150,230,0.18)" stroke-width="1" fill="none">
    <path d="M 380 420 Q 560 480 640 560"/>
    <path d="M 640 560 Q 740 620 820 700"/>
    <path d="M 820 700 Q 700 940 480 1180"/>
    <path d="M 380 420 Q 260 560 140 700"/>
    <path d="M 480 1180 Q 320 1220 200 1240"/>
    <path d="M 820 700 Q 900 800 900 880"/>
  </g>

  <!-- faint frame -->
  <rect x="60" y="60" width="1080" height="1480" fill="none" stroke="rgba(236,233,226,0.06)"/>
</svg>
