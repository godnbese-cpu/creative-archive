<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <radialGradient id="bg" cx="38%" cy="42%" r="95%">
      <stop offset="0%" stop-color="#141223"/>
      <stop offset="55%" stop-color="#0b0a12"/>
      <stop offset="100%" stop-color="#07070b"/>
    </radialGradient>
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8f7bff" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#5b84ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5b84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ece9e2" stop-opacity="0.9"/>
      <stop offset="18%" stop-color="#b7c4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5b84ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07070b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#07070b" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- drifting nebula bodies -->
  <ellipse cx="560" cy="430" rx="620" ry="380" fill="url(#neb1)"/>
  <ellipse cx="1120" cy="620" rx="520" ry="330" fill="url(#neb2)"/>
  <ellipse cx="980" cy="330" rx="300" ry="190" fill="url(#neb1)" opacity="0.6"/>

  <!-- dust specks -->
  <g fill="#ece9e2">
    <circle cx="140" cy="180" r="1.1" opacity="0.5"/><circle cx="320" cy="90" r="0.8" opacity="0.35"/>
    <circle cx="520" cy="210" r="1.3" opacity="0.55"/><circle cx="760" cy="120" r="0.9" opacity="0.4"/>
    <circle cx="1010" cy="170" r="1.1" opacity="0.5"/><circle cx="1290" cy="110" r="0.8" opacity="0.3"/>
    <circle cx="1450" cy="260" r="1.4" opacity="0.55"/><circle cx="240" cy="420" r="0.9" opacity="0.35"/>
    <circle cx="130" cy="700" r="1.2" opacity="0.45"/><circle cx="430" cy="820" r="1" opacity="0.4"/>
    <circle cx="880" cy="880" r="1.3" opacity="0.5"/><circle cx="1180" cy="800" r="0.9" opacity="0.35"/>
    <circle cx="1400" cy="700" r="1.1" opacity="0.45"/><circle cx="1540" cy="520" r="0.8" opacity="0.3"/>
    <circle cx="660" cy="560" r="0.9" opacity="0.4"/><circle cx="360" cy="620" r="1" opacity="0.35"/>
    <circle cx="1240" cy="440" r="1" opacity="0.45"/><circle cx="1080" cy="640" r="0.8" opacity="0.3"/>
  </g>
  <g fill="#8f7bff">
    <circle cx="700" cy="300" r="1.6" opacity="0.7"/><circle cx="1330" cy="560" r="1.4" opacity="0.6"/>
    <circle cx="290" cy="310" r="1.2" opacity="0.5"/>
  </g>
  <g fill="#86ef6e">
    <circle cx="1510" cy="840" r="1.3" opacity="0.5"/><circle cx="90" cy="500" r="1.1" opacity="0.45"/>
  </g>

  <!-- the bright core world -->
  <circle cx="980" cy="330" r="140" fill="url(#core)"/>
  <circle cx="980" cy="330" r="7" fill="#ece9e2" opacity="0.95"/>

  <!-- faint constellation traces -->
  <g stroke="rgba(180,176,230,0.20)" stroke-width="1">
    <line x1="700" y1="300" x2="980" y2="330"/>
    <line x1="980" y1="330" x2="1330" y2="560"/>
    <line x1="980" y1="330" x2="290" y2="310"/>
    <line x1="700" y1="300" x2="520" y2="210"/>
    <line x1="1330" y1="560" x2="1400" y2="700"/>
  </g>
  <g fill="#b7c4ff" opacity="0.8">
    <circle cx="700" cy="300" r="2.6"/><circle cx="1330" cy="560" r="2.4"/><circle cx="290" cy="310" r="2"/>
  </g>

  <!-- orbital arcs -->
  <g fill="none" stroke="rgba(236,233,226,0.10)" stroke-width="1">
    <ellipse cx="980" cy="330" rx="260" ry="90" transform="rotate(-18 980 330)"/>
    <ellipse cx="980" cy="330" rx="400" ry="150" transform="rotate(-18 980 330)"/>
  </g>

  <rect width="1600" height="1000" fill="url(#fade)"/>
</svg>
